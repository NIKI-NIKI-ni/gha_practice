# Имя workflow. Так он будет записан во вкладке Actions
name: Hello
# Триггер: запускать при каждом push в любую ветку
on: [push]
# Список заданий 
jobs:
  # ID задания. Придумаешь сам: латиница без пробелов и спецсимволов, например: hello
  hello:
    # На какой машине запускать задание. В данном случае на последней версии Ubuntu
    runs-on: ubuntu-latest
    # Шаги выполняются строго сверху вниз. 
    steps:
      # Шаг 1: checkout - скачиваем код репозитория на машину, где выполняется workflow
      - name: Скачать код репозитория
        uses: actions/checkout@v4
      # Шаг 2: вывести информацию о пользователе и ветке
      - name: Вывести информацию о пользователе и ветке
        run: | 
          echo "Привет, ${{ github.actor }}! Ветка: ${{ github.ref_name }}"
      # Шаг 3: вывести список файлов в репозитории
      - name: Список файлов
        run: ls -la
        